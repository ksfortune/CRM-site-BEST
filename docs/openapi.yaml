openapi: 3.0.3
info:
  title: CRM BEST
  description: Контракты для фронта и бэка
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

paths:
  /auth/login:
    post:
      summary: Вход в систему
      description: Аутентификация по email и паролю, возвращает JWT-токен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "ivan@example.com"
                password:
                  type: string
                  format: password
                  example: "password33"
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "YaLuBLuIgRatV33..."
                    description: JWT-токен для доступа к защищенным эндпоинтам
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /companies:
    get:
      summary: Получить список всех компаний
      description: Возвращает массив компаний
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Добавить новую компанию
      description: Создает новую компанию в БД
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '201':
          description: Компания создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "ivan@example.com"
          description: Почта пользователя (логин)
        name:
          type: string
          example: "Иван Фролов"
          description: Имя пользователя
        role:
          type: string
          example: "user"
          description: Роль пользователя

    Error:
      type: object
      properties:
        code:
          type: integer
          example: 401
          description: Код ошибки
        message:
          type: string
          example: "Неверный email или пароль"
          description: Текст ошибки

    Company:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ID компании
        name:
          type: string
          example: "ООО Тлиз"
          description: Название компании
        status:
          type: string
          example: "Горячая"
          description: Статус компании (тёплая/горячая)
        spheres:
          type: array
          items:
            type: string
          example: ["Еда", "Напитки"]
          description: Сферы деятельности компании
        availability:
          type: string
          example: "Ксен Бальб"
          description: "Кем занята компания (или Свободна)"

    CompanyInput:
      type: object
      required:
        - name
        - sphere
        - status
      properties:
        name:
          type: string
          example: "ООО Тлиз"
          description: Название компании
        sphere:
          type: string
          example: "Еда"
          description: Сфера деятельности
        status:
          type: string
          example: "Теплая"
          description: Статус компании
        contact_name:
          type: string
          example: "Иван Фролов"
          description: Имя представителя (опционально)
        contact_phone:
          type: string
          example: "+7 999 228-52-33"
          description: Телефон представителя (опционально)
        contact_email:
          type: string
          format: email
          example: "ivan@example.com"
          description: Почта представителя (опционально)
