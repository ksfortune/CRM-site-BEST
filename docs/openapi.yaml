openapi: 3.0.3
info:
  title: CRM BEST
  description: Контракты для фронта и бэка
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

paths:
  /auth/login:
    post:
      summary: Вход в систему
      description: Аутентификация по email и паролю, возвращает JWT-токен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "ivan@example.com"
                password:
                  type: string
                  format: password
                  example: "password33"
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "YaLuBLuIgRatV33..."
                    description: JWT-токен для доступа к защищенным эндпоинтам
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /companies:
    get:
      summary: Получить список всех компаний
      description: Возвращает массив компаний
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Добавить новую компанию
      description: Создает новую компанию в БД
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '201':
          description: Компания создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}/companies:
    get:
      summary: Получить компании пользователя
      description: Возвращает id и name компаний юзера
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCompany'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "ivan@example.com"
          description: Почта пользователя (логин)
        name:
          type: string
          example: "Иван Фролов"
          description: Имя пользователя
        role:
          type: string
          example: "user"
          description: Роль пользователя
        socials:
          type: array
          items:
            $ref: '#/components/schemas/Social'
          description: Список соцсетей пользователя

    Error:
      type: object
      properties:
        code:
          type: integer
          example: 401
          description: Код ошибки
        message:
          type: string
          example: "Неверный email или пароль"
          description: Текст ошибки

    Company:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ID компании
        name:
          type: string
          example: "ООО Тлиз"
          description: Название компании
        status:
          type: string
          example: "Горячая"
          description: Статус компании (тёплая/горячая)
        spheres:
          type: array
          items:
            type: string
          example: ["Еда", "Напитки"]
          description: Сферы деятельности компании
        availability:
          type: object
          properties:
            userId:
              type: integer
              example: 5
              description: ID пользователя, который занял компанию (null если свободна)
            userName:
              type: string
              example: "Ксен Бальб"
              description: Имя пользователя (null если свободна)
          description: Информация о том, кто занял компанию
        representatives:
          type: array
          items:
            $ref: '#/components/schemas/Representative'
          description: Список представителей компании

    CompanyInput:
      type: object
      required:
        - name
        - spheres
        - status
      properties:
        name:
          type: string
          example: "ООО Тлиз"
          description: Название компании
        spheres:
          type: array
          items:
            type: string
          example: ["Еда", "Напитки"]
          description: Сферы деятельности компании
        status:
          type: string
          enum: ["Теплая", "Горячая"]
          example: "Теплая"
          description: Статус компании

    Social:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ID записи
        type:
          type: string
          enum: ["facebook", "vk", "tg", "phone"]
          example: "phone"
          description: Тип (facebook/vk/tg/phone)
        value:
          type: string
          example: "+7 999 123-45-67"
          description: Значение (ссылка или номер телефона)

    UserCompany:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ID компании
        name:
          type: string
          example: "ООО Тлиз"
          description: Название компании

    Representative:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ID представителя
        name:
          type: string
          example: "Иван Петров"
          description: Имя представителя
        email:
          type: string
          format: email
          example: "ivan@example.com"
          description: Почта представителя
        socials:
          type: array
          items:
            $ref: '#/components/schemas/Social'
          description: Список соцсетей и телефона представителя